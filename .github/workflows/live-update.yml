# Every 4 hours: find new Sentinel-1 scenes over Indian seas, run the oil-slick model,
# store detections + overlay images in the cloud database (Neon). The website reads them.
name: live-update

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look for scenes"
        default: "3"

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e .
          pip install onnxruntime "sqlalchemy>=2" "psycopg[binary]>=3.2"

      - name: Download model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download model-v1 --pattern model.onnx --dir models

      - name: Detect slicks in new scenes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OILSPILL_DATA_DIR: ${{ runner.temp }}/oilspill
          OILSPILL_MODELS_DIR: models
        run: |
          DAYS="${{ github.event.inputs.days || '3' }}"
          python scripts/run_batch.py --start "$(date -u -d "-${DAYS} days" +%F)" --max-scenes 300
