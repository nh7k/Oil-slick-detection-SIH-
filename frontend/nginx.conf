server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GeoTIFF uploads can be large.
    client_max_body_size 1024m;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;

    # Resolve the "api" service at request time (Docker embedded DNS) so nginx
    # starts even if the API container is not up yet.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routes such as /slicks/123
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
